# 기준봉 단타 자동매매 설정 (시각은 반드시 따옴표, 퍼센트는 퍼센트 단위: 3.0 = 3%)
# App Key / Secret 은 여기에 쓰지 않는다. kwcli(kiwoomcli setup)에 모드별로 등록된 키를 쓴다.

mode: real              # demo: 모의투자 / real: 실제투자 (실제 돈으로 주문)

session:
  start: "08:00"                     # 기준봉 탐색 시작 (프리장)
  skip_first_bars: ["08:00", "09:00"] # 기준봉에서 제외할 첫 1분봉 (프리장, 정규장)
  entry_end: "15:00"                 # 이 시각 이후 시작하는 봉은 기준봉으로 보지 않음
  force_close: "15:15"               # 남은 보유 전량 청산
  stop: "15:20"                      # 프로그램 종료

universe:
  rank_top: 30            # 거래대금 상위 N위 이내
  min_change_pct: 6.0     # 전일 종가 대비 등락률 하한(%)
  pool_size: 100          # 실시간 시세를 미리 받아 둘 거래대금 상위 종목 수 (기준봉 직전 봉을 놓치지 않으려고)
  rank_interval_sec: 10   # 순위 갱신 주기(초)
  stex_tp: "3"            # 순위 거래소: 1 KRX, 2 NXT, 3 통합
  tick_suffix: "_AL"      # 실시간 시세 종목코드 접미사: "" KRX, "_NX" NXT, "_AL" 통합

signal:
  volume_ratio: 2.5       # 기준봉 거래량 ≥ 직전 1분봉 거래량 × 2.5
  close_up_pct: 1.5       # 기준봉 종가 ≥ 직전 1분봉 종가 × (1 + 1.5%)
  buy_delay_min: 2        # 기준봉 완성 N분 후 시장가 매수
  judge_after_min: 5      # 기준봉 완성 N분 후 종가로 판정
  judge_up_pct: 3.0       # 판정 시 종가 ≥ 기준봉 종가 × (1 + 3%) 이면 보유, 아니면 전량 매도
  exit_after_min: 15      # 판정 통과 시 기준봉 완성 N분 후 전량 매도

exit:
  stop_loss_pct: 3.0      # 1분봉 종가 ≤ 매수가 × (1 - 3%) 이면 전량 손절
  partial_take_pct: 5.0   # 수익률 +5% 도달 시 (실시간, 1회)
  partial_ratio: 0.5      # 보유 수량의 50% 매도

max_positions: 2          # 동시 보유 최대 종목 수

sizing:
  mode: percent           # percent: 기준금액의 N% / fixed: 매번 고정 금액
  percent: 50             # 기준금액 = 보유 종목이 0개일 때의 매수가능금액
  fixed_krw: 1000000      # mode=fixed 일 때 1회 매수 금액(원)

order:                    # 매수·매도 모두 최유리지정가
  exchange: "KRX"         # 주문 거래소: KRX | NXT | SOR (프리장 주문은 NXT/SOR 필요, 모의투자 지원 여부 확인 필요)
  timeout_sec: 10         # 이 시간 안에 다 체결되지 않으면 잔량 취소 (매도 잔량은 즉시 다시 주문)

telegram:
  enabled: true          # 텔레그램 알림·명령 (토큰은 Windows 자격 증명 관리자에 등록됨)

api:
  rate_per_sec: 3.0       # 키움 REST 초당 최대 호출
